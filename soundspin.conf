# SoundSpin configuration
# See README.md for details.

# Required: WebSocket URL of the Sendspin server.
# The default port is 8927 and path is /sendspin.
# Assuming your using music assistant as a homeassistant addon, the server URL is likely ws://homeassistant.lan:8927/sendspin
server_url = ws://homeassistant.lan:8927/sendspin

# Optional: Friendly name shown in the Sendspin UI.
player_name = SoundSpin

# Optional: Log level (none, error, warn, info, debug, verbose).
log_level = info

initial_volume = 10
