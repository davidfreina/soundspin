# SoundSpin configuration
# See README.md for details.

# Required: WebSocket URL of the Sendspin server.
# The default port is 8927 and path is /sendspin.
# Assuming your using music assistant as a homeassistant addon, the server URL is likely ws://homeassistant.lan:8927/sendspin
server_url = ws://homeassistant.lan:8927/sendspin

# Optional: Friendly name shown in the Sendspin UI.
player_name = SoundSpin

# Optional: Log level (none, error, warn, info, debug, verbose).
log_level = info

initial_volume = 10

# Optional: Write logs here (stdout+stderr). Recommended under auto-boot, where
# output is otherwise discarded. Truncated on each start; keep it on tmpfs.
#log_file = /tmp/soundspin.log

# Optional: Extra subnets allowed to connect to the speaker (space-separated),
# used by the auto-boot firewall. Its own subnet is always allowed.
#firewall_allow = 10.0.20.0/24

# Optional: Volume change per button press (1-25).
#volume_step = 5

# Optional: Button bindings. Keys: volume_up, volume_down, power, aux,
# preset_1..preset_6. Append _long for a long-press (>= 0.8 s) action.
# Actions: volume_up, volume_down, mute, play_pause, play, pause, stop, next,
# previous, shuffle, repeat, switch, none. Defaults shown.
#button_power    = play_pause
#button_aux      = mute
#button_preset_1 = previous
#button_preset_2 = play_pause
#button_preset_3 = next
#button_preset_4 = shuffle
#button_preset_5 = repeat
#button_preset_6 = none
